<section class="contact">

<h2>お問い合わせ</h2>

<p class="contact-text">
NICOに関するご質問やご相談など、<br>
お気軽にお問い合わせください。
</p>


<form class="contact-form">

<label for="name">お名前</label>
<input type="text" id="name" name="name" placeholder="お名前を入力してください">


<label for="email">メールアドレス</label>
<input type="email" id="email" name="email" placeholder="メールアドレスを入力してください">


<label for="message">お問い合わせ内容</label>
<textarea id="message" name="message" rows="8" placeholder="お問い合わせ内容を入力してください"></textarea>


<button type="submit">送信する</button>

</form>

</section>
